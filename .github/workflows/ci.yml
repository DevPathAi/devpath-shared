name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: devpath
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: devpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.2.0
        with:
          distribution: temurin
          java-version: 21.0.12+8
          check-latest: false
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.0.0
        with:
          cache-disabled: true
      - name: Verify release workflow contracts
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Build and generate exact immutable publication bytes
        run: >-
          ./gradlew clean build
          generatePomFileForMavenPublication
          generateMetadataFileForMavenPublication
          --no-build-cache --no-daemon
        env:
          DB_URL: jdbc:postgresql://localhost:5432/devpath
          DB_USER: devpath
          DB_PASSWORD: localdev
      - name: Verify exact ET9 JAR, POM, and Gradle module bytes
        run: >-
          python3 scripts/release/immutable_shared_package.py verify-local
          --jar build/libs/devpath-shared-0.0.1-et9.20260816.jar
          --pom build/publications/maven/pom-default.xml
          --module build/publications/maven/module.json
      - name: Retain the verified publication bytes for PR inspection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: immutable-shared-publication-${{ github.sha }}
          path: |
            build/libs/devpath-shared-0.0.1-et9.20260816.jar
            build/publications/maven/pom-default.xml
            build/publications/maven/module.json
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.migration
          push: true
          tags: ghcr.io/devpathai/devpath-migration:${{ github.sha }}
