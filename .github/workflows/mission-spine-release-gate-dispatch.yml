---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20261016-leva-inspection-fixes

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected migration release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch migration as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-migration-release.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20261016-leva-inspection-fixes",
              "source_sha": "9793b8f92f92cca1ef57e28d2db6fb7d911741a3",
              "sealed_release_sha": "66f480a8a25483e3336f7658adfa1524d0bead7d",
              "gitops_source_sha": "88559c6509e50c2c7059b03fec83bf54c03077fd",
              "release_manifest_sha256": "50c40afbcb37d162fd1ece6270bd12a6d8826e3ca93e98cb40bf7ce2ca876801"
            }
          }
          JSON
