---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260930-s3-web-redesign-r3

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected migration release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch migration as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-migration-release.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260930-s3-web-redesign-r3",
              "source_sha": "9793b8f92f92cca1ef57e28d2db6fb7d911741a3",
              "sealed_release_sha": "f80f44da34fa1d84548387b9673154b4ef738645",
              "gitops_source_sha": "5427fe1e6e5729309687c0ddec3fc1a8b16683f1",
              "release_manifest_sha256": "2f41143ffe7a46e95e180e26711f067c6718f21f0d1de3cc22b2bf3a21a9a87a"
            }
          }
          JSON
